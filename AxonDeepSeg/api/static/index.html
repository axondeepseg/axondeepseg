<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AxonDeepSeg</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 60rem;
      margin: 0 auto;
      padding: 2rem 1rem;
      line-height: 1.5;
    }
    h1 { margin-bottom: 0.25rem; }
    .subtitle { opacity: 0.7; margin-top: 0; }
    .controls { display: flex; gap: 0.75rem; align-items: center; flex-wrap: wrap; margin: 1.5rem 0; }
    button { padding: 0.5rem 1rem; font-size: 1rem; cursor: pointer; }
    button:disabled { cursor: not-allowed; opacity: 0.5; }
    #status { font-variant-numeric: tabular-nums; }
    #status[data-status="failed"] { color: #c0392b; }
    #error { color: #c0392b; white-space: pre-wrap; }
    .masks { display: grid; grid-template-columns: repeat(auto-fit, minmax(15rem, 1fr)); gap: 1rem; }
    figure { margin: 0; }
    figcaption { font-size: 0.875rem; opacity: 0.7; margin-bottom: 0.35rem; }
    img { width: 100%; border: 1px solid rgba(128, 128, 128, 0.4); background: #fff; }
    img:not([src]) { display: none; }
  </style>
</head>
<body>
  <h1>AxonDeepSeg</h1>
  <p class="subtitle">Axon and myelin segmentation from microscopy images.</p>

  <div class="controls">
    <input type="file" id="file-input" accept=".png,.tif,.tiff,.jpg,.jpeg">
    <button id="segment-button">Segment</button>
    <span id="status" data-status="idle">Idle</span>
  </div>

  <p id="error"></p>

  <div class="masks">
    <figure>
      <figcaption>Axon</figcaption>
      <img id="axon" alt="Axon mask">
    </figure>
    <figure>
      <figcaption>Myelin</figcaption>
      <img id="myelin" alt="Myelin mask">
    </figure>
    <figure>
      <figcaption>Axon + myelin</figcaption>
      <img id="axonmyelin" alt="Combined axon and myelin mask">
    </figure>
  </div>

  <script>
    const WARMUP_DEBOUNCE_MS = 30000;
    const MASKS = ['axon', 'myelin', 'axonmyelin'];

    const fileInput = document.getElementById('file-input');
    const segmentButton = document.getElementById('segment-button');
    const statusEl = document.getElementById('status');
    const errorEl = document.getElementById('error');

    function setStatus(status, message) {
      statusEl.dataset.status = status;
      statusEl.textContent = message ?? status;
    }

    function reset() {
      errorEl.textContent = '';
      MASKS.forEach((name) => document.getElementById(name).removeAttribute('src'));
    }

    // Pre-warm. Opening the file dialog is the earliest strong signal that a
    // segmentation is coming, and the user then spends several seconds finding their
    // image -- so spend that time loading the model instead of making them wait for it
    // after they hit Segment. Fire-and-forget: /warmup is idempotent, and if it fails
    // the segment request loads the model itself anyway.
    let lastWarmup = 0;
    fileInput.addEventListener('click', () => {
      const now = Date.now();
      if (now - lastWarmup < WARMUP_DEBOUNCE_MS) return;
      lastWarmup = now;
      fetch('/warmup', { method: 'POST' }).catch(() => {});
    });

    segmentButton.addEventListener('click', async () => {
      const file = fileInput.files[0];
      if (!file) {
        setStatus('idle', 'Choose an image first.');
        return;
      }

      reset();
      segmentButton.disabled = true;
      setStatus('running', 'segmenting…');

      try {
        const body = new FormData();
        body.append('file', file);

        // Synchronous: the masks come back in this response. No job id, no polling --
        // a segmentation is ~2s on a GPU.
        const response = await fetch('/segment', { method: 'POST', body });
        if (!response.ok) {
          const detail = await response.json().catch(() => ({}));
          throw new Error(detail.detail ?? `HTTP ${response.status}`);
        }

        const result = await response.json();
        MASKS.forEach((name) => {
          document.getElementById(name).src = `data:image/png;base64,${result[name]}`;
        });
        // The test waits on this attribute, so set it only once the masks are attached.
        setStatus('done', `done — ${result.meta.shape.join(' × ')} px, ${result.meta.model}`);
      } catch (err) {
        errorEl.textContent = err.message;
        setStatus('failed', 'failed');
      } finally {
        segmentButton.disabled = false;
      }
    });
  </script>
</body>
</html>
