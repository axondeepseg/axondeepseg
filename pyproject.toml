[build-system]
requires = ["setuptools>=63", "wheel", "setuptools_scm"]
build-backend = "setuptools.build_meta"

[project]
name = "AxonDeepSeg"
dynamic = ["version"]
description = "Axon/Myelin segmentation using AI"
readme = "README.md"
requires-python = ">=3.11, <3.13"
license = {text = "MIT"}
authors = [{"name" = "NeuroPoly Lab, Polytechnique Montreal", "email" = "axondeepseg@googlegroups.com"}
]

classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Framework :: napari",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Image Processing",
]

dependencies =[
    "numpy<2",
    "scipy",
    "scikit-image!=0.25.0,!=0.25.1",
    "tabulate",
    "pandas",
    "matplotlib",
    "mpld3",
    "tqdm",
    "requests",
    "pillow!=9.0.0",
    "imageio>=2.28.0",
    "pytest",
    "pytest-cov",
    "prettytable",
    "openpyxl",
    "acvl_utils!=0.2.1",
    "nnunetv2==2.2.1",
    "loguru",
    "torch<2.4.0",
    "pydicom<3",
    "jinja2",
    "fastapi",
    "uvicorn[standard]",
    "python-multipart",
    "httpx",
]

# The napari plugin and its Qt stack are kept out of the base install so that
# AxonDeepSeg can be installed headless — in a server or inference container,
# where a desktop GUI toolkit is dead weight. PyQt5 also publishes no linux-aarch64
# wheel, so a base install that required it could not build on ARM (e.g. Graviton).
# Qt/napari imports are confined to AxonDeepSeg/ads_napari/.
[project.optional-dependencies]
gui = [
    "napari[pyqt5,optional-base,bermuda]<0.7.0",
    "magicgui",
    "qtpy",
    "qtconsole<5.4.2",
    "pytest-qt",
    "jupyter",
]
# Browser-driven tests for the HTTP API (test/api/test_server_integration.py).
test = [
    "playwright",
]

keywords = ["axon", "myelin", "segmentation", "microscopy"]

[project.entry-points."napari.manifest"]
AxonDeepSeg = "AxonDeepSeg.ads_napari:napari.yaml"

[project.urls]
"Homepage" = "https://github.com/neuropoly/axondeepseg"
"Bug Tracker" = "https://github.com/axondeepseg/axondeepseg/issues"
"Documentation" = "https://github.com/axondeepseg/axondeepseg#README.md"
"Source Code" = "https://github.com/axondeepseg/axondeepseg"
"User Support" = "https://github.com/axondeepseg/axondeepseg/issues"

[project.scripts]
download_model = "AxonDeepSeg.download_model:main"
download_tests = "AxonDeepSeg.download_tests:main"
axondeepseg = "AxonDeepSeg.segment:main"
axondeepseg_test = "AxonDeepSeg.integrity_test:main"
axondeepseg_morphometrics = "AxonDeepSeg.morphometrics.launch_morphometrics_computation:main"
axondeepseg_aggregate = "AxonDeepSeg.morphometrics.aggregate:main"
ads_server = "AxonDeepSeg.api.server:main"

[tool.setuptools]
include-package-data = true

# Discover subpackages (visualization, morphometrics, qa, testing, api, ads_napari)
# explicitly. They previously reached the wheel only because setuptools_scm sweeps in
# git-tracked files, so building from a source tree with no .git -- a Docker build
# context, for instance -- silently dropped them and produced a package where
# `import AxonDeepSeg.apply_model` fails on AxonDeepSeg.visualization.
[tool.setuptools.packages.find]
include = ["AxonDeepSeg*"]
namespaces = false

[tool.setuptools.package-data]
# version.txt is read by AxonDeepSeg/__init__.py at import time. It must be declared
# here: it otherwise only lands in the wheel because setuptools_scm sweeps in
# git-tracked files, so building from a source tree with no .git (e.g. a Docker build
# context) produces a package that cannot be imported.
"*" = ["*.yaml", "version.txt"]
"AxonDeepSeg.api" = ["static/*.html"]

[tool.setuptools.dynamic]
version = {attr = "AxonDeepSeg.__init__.__version__"}
