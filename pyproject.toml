[build-system]
requires = ["setuptools>=63", "wheel", "setuptools_scm"]
build-backend = "setuptools.build_meta"

[project]
name = "AxonDeepSeg"
dynamic = ["version"]
description = "Axon/Myelin segmentation using AI"
readme = "README.md"
requires-python = ">=3.11, <3.13"
license = {text = "MIT"}
authors = [{"name" = "NeuroPoly Lab, Polytechnique Montreal", "email" = "axondeepseg@googlegroups.com"}
]

classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Framework :: napari",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Image Processing",
]

dependencies =[
    "numpy<2",
    "scipy",
    "scikit-image!=0.25.0,!=0.25.1",
    "tabulate",
    "pandas",
    "matplotlib",
    "mpld3",
    "tqdm",
    "requests",
    "pillow!=9.0.0",
    "imageio>=2.28.0",
    "pytest",
    "pytest-cov",
    "prettytable",
    "jupyter",
    "openpyxl",
    "qtconsole<5.4.2",
    "napari[pyqt5,optional-base,bermuda]<0.7.0",
    "acvl_utils!=0.2.1",
    "nnunetv2==2.8.1",
    "coremltools>=8.0; sys_platform == 'darwin' and platform_machine == 'arm64'",     # Apple silicon only: runs the forward pass on the Neural Engine (~3x faster).
    "loguru",
    "torch",
    "pydicom<3",
    "pytest-qt",
    "magicgui",
    "qtpy",
    "jinja2",
]

keywords = ["axon", "myelin", "segmentation", "microscopy"]

[project.entry-points."napari.manifest"]
AxonDeepSeg = "AxonDeepSeg.ads_napari:napari.yaml"

[project.urls]
"Homepage" = "https://github.com/neuropoly/axondeepseg"
"Bug Tracker" = "https://github.com/axondeepseg/axondeepseg/issues"
"Documentation" = "https://github.com/axondeepseg/axondeepseg#README.md"
"Source Code" = "https://github.com/axondeepseg/axondeepseg"
"User Support" = "https://github.com/axondeepseg/axondeepseg/issues"

[project.scripts]
# Legacy commands (will eventually be deprecated)
axondeepseg = "AxonDeepSeg.cli_deprecated:axondeepseg"
axondeepseg_test = "AxonDeepSeg.cli_deprecated:axondeepseg_test"
axondeepseg_morphometrics = "AxonDeepSeg.cli_deprecated:axondeepseg_morphometrics"
axondeepseg_aggregate = "AxonDeepSeg.cli_deprecated:axondeepseg_aggregate"
axondeepseg_filter = "AxonDeepSeg.cli_deprecated:axondeepseg_filter"
axondeepseg_count = "AxonDeepSeg.cli_deprecated:axondeepseg_count"
# New entry points
ads_segment = "AxonDeepSeg.segment:main"
ads_test = "AxonDeepSeg.integrity_test:main"
ads_morphometrics = "AxonDeepSeg.morphometrics.launch_morphometrics_computation:main"
ads_aggregate = "AxonDeepSeg.morphometrics.aggregate:main"
ads_filter = "AxonDeepSeg.morphometrics.filter_morphometrics:main"
ads_count = "AxonDeepSeg.morphometrics.count_axons:main"
# Other tools
download_model = "AxonDeepSeg.download_model:main"
download_tests = "AxonDeepSeg.download_tests:main"


[tool.setuptools]
packages = ["AxonDeepSeg"]
package-dir = {AxonDeepSeg = "AxonDeepSeg"}
include-package-data = true

[tool.setuptools.package-data]
"*" = ["*.yaml"]

[tool.setuptools.dynamic]
version = {attr = "AxonDeepSeg.__init__.__version__"}
